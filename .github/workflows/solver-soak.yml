name: solver-soak
# Every dispatch is otherwise titled just "solver-soak", and several are usually run at
# once — one per board.
run-name: "solver-soak: ${{ inputs.game }} ${{ inputs.deals }}${{ inputs.mb && format(' at {0} MB', inputs.mb) || '' }} on ${{ github.ref_name }}"

# A full soak for the benchmark record (docs/solver.md), split across jobs so an
# hour of deals is a few minutes of wall clock and none of a session's. Run it from
# the Actions tab on the branch whose solver it should measure; the `summary` job
# prints the record's row on the run page. Only a change meant to move the counts
# needs one — § Before you change the solver says which.

on:
  workflow_dispatch:
    inputs:
      game:
        description: Board, by `Game.t` id
        type: choice
        default: freecell
        options:
          - freecell
          - simplesimon
          - minifreecell
          - microfreecell
          - spiderette1
          - spiderette2
          - spiderette4
          - spider1
          - spider2
          - spider4
      deals:
        description: Range of deals, `from-to`
        type: string
        default: 1-1000
      mb:
        description: Memory cap in megabytes (`--mb`); empty for the medium tier
        type: string
        default: ""
      jobs:
        description: Jobs to split the range across
        type: number
        default: 8

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.slice.outputs.slices }}
    steps:
      - id: slice
        env:
          DEALS: ${{ inputs.deals }}
          MB: ${{ inputs.mb }}
          JOBS: ${{ inputs.jobs }}
        run: |
          [[ "$DEALS" =~ ^([0-9]+)-([0-9]+)$ ]] || { echo "deals must be from-to, got '$DEALS'"; exit 1; }
          from=${BASH_REMATCH[1]} to=${BASH_REMATCH[2]}
          [[ -z "$MB" || "$MB" =~ ^[0-9]+$ ]] || { echo "mb must be a whole number"; exit 1; }
          [[ "$JOBS" =~ ^[0-9]+$ ]] && (( JOBS >= 1 && JOBS <= 64 )) || { echo "jobs must be 1-64"; exit 1; }
          n=$(( to - from + 1 )); (( n >= 1 )) || { echo "empty range"; exit 1; }
          (( JOBS > n )) && JOBS=$n
          slices=""
          for (( i = 0; i < JOBS; i++ )); do
            a=$(( from + i * n / JOBS )) b=$(( from + (i + 1) * n / JOBS - 1 ))
            slices+="${slices:+,}\"$a-$b\""
          done
          echo "slices=[$slices]" >> "$GITHUB_OUTPUT"

  soak:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.plan.outputs.slices) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      # `solve` exits non-zero when a deal goes unsolved, which on some boards is the
      # record, not a failure. The record file is written only once the last deal is
      # done, so its absence is what fails the slice.
      - name: Soak the slice
        env:
          GAME: ${{ inputs.game }}
          MB: ${{ inputs.mb }}
          SLICE: ${{ matrix.slice }}
        run: |
          mise run solve -- --game "$GAME" --quiet --record "soak-$SLICE.json" ${MB:+--mb "$MB"} "$SLICE" || true
          test -s "soak-$SLICE.json"

      - uses: actions/upload-artifact@v7
        with:
          name: soak-${{ matrix.slice }}
          path: soak-${{ matrix.slice }}.json
          retention-days: 30

  summary:
    needs: soak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - uses: actions/download-artifact@v7
        with:
          pattern: soak-*
          merge-multiple: true

      - name: The record's row
        run: |
          mise run soak-summary -- soak-*.json | tee row.md
          { echo '```'; cat row.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
