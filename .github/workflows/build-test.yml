name: build-test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Run CI
        run: mise run ci

  # The browser-driven checks (packages/web-app/browser-tests, issue #243). Its own
  # job rather than part of `mise run ci`: it needs a downloaded Chromium and a
  # bundled dist/, where `ci` is browser-free and only builds. Independent of
  # `build-test`, so a red one of these still tells you about the other.
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install headless Chromium
        run: mise run playwright-install

      - name: Run the browser test suite
        run: mise run verify

      # On a failure the HTML report carries the trace of the first retry
      # (`trace: on-first-retry`) — open it with `playwright show-report` to step
      # through the run frame by frame.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/web-app/playwright-report
            packages/web-app/test-results
          retention-days: 7
