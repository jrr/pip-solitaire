name: build-test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Run CI
        run: mise run ci

  # Capped so a hung browser download can't leave a PR's check spinning until the
  # runner's 6h default; the suite itself runs in a couple of minutes.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      # `playwright install --with-deps` reaches the network twice — the browser
      # download, and an `apt-get` for the system libraries — and either can stall
      # indefinitely on a bad mirror or CDN edge rather than erroring out. A ~30s
      # step, so cap it and let a stall fail fast instead of hanging the job.
      - name: Install headless Chromium
        run: mise run playwright-install
        timeout-minutes: 5

      - name: Run the browser test suite
        run: mise run browsertest

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/web-app/playwright-report
            packages/web-app/test-results
          retention-days: 7