name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Human-driven mentions (comments, issues, and human PR reviews) run
  # automatically. The PR-review clause here is scoped to non-bot authors;
  # bot reviews are handled by the manually-approved `claude-from-bot-review`
  # job below so the reviewer <-> implementer ping-pong stays human-gated.
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.type != 'Bot') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Far above what the work needs, and deliberately so: over 57 real runs in
    # the three weeks to 2026-09-19 the median was 15 minutes and the 90th
    # percentile 26, but a solver change that soaked Spiderette took 80. The cap
    # exists so a wedged run can't hold a runner until the 6h default, not to
    # bound the agent — if a legitimate soak ever gets cancelled here, raise it.
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Don't leave the read-only GITHUB_TOKEN (github-actions[bot],
          # contents: read here) persisted in git config. claude-code-action
          # pushes with the Claude GitHub App token (as claude[bot], whose
          # write access comes from the app installation, not this workflow's
          # permissions block). Since actions/checkout v6 changed how it
          # persists those credentials, a persisted github-actions[bot] token
          # hijacks the push and it 403s. Turning persistence off restores the
          # app-token push. See issue #56.
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Agents operate through the mise task interface (see CLAUDE.md), not
          # raw package-manager/CLI access. Web access is limited to the
          # project's toolchain docs. To grant a new capability, add a mise
          # task or a specific WebFetch domain here rather than widening these.
          claude_args: |
            --model claude-opus-5
            --append-system-prompt "When your change is implemented on a branch and mise run ci is green, open the pull request yourself with gh pr create (link the issue it closes). Opening the PR is part of finishing the task — do not stop at a summary comment or a 'Create PR' link, and do not wait to be asked. Only skip this if the requirements are genuinely ambiguous or CI can't go green, and then say what's blocking on the issue. gh pr create --body bypasses the repository's PR template, so read .github/pull_request_template.md and write the body in its shape: the issue owns what and why, the PR owns the decisions made while building and where to look. A run has a hard clock, and the solver's soaks can outlast it: mise run solve over the thousand deals is minutes per board, the Spiderette soak is half an hour, and a run cut off mid-soak loses everything it hadn't pushed. So push before you start anything long: commit and push the change itself, then soak. Run the cheap soaks yourself (Mini and Micro are seconds, FreeCell a couple of minutes) and don't start one the remaining run can't finish. When a soak you'd want is too long for the run, end your work by pushing what you have and saying, in the PR or your comment, the exact command to run next (e.g. mise run solve -- --game spiderette4 --quiet 1-200) and which number in docs/solver.md it is measured against, so a human or a later run can pick it up. A blocked host or a denied tool is a stop signal, not an obstacle to work around. Web access here is a short allowlist of toolchain-docs domains and Bash is a short list of mise and gh commands, so a refusal means the interface is too narrow for what you were asked, not that you should improvise. Never route around it, never answer from memory what you went to the docs for, and never quietly drop the part of the task it blocked. Push whatever is already finished, then comment naming the exact host or command that was refused, the URL or invocation, what you needed it for, and what is now unfinished. A blocked domain is a request for a WebFetch(domain:<host>) entry in .github/workflows/; a denied command is a request for a mise task. Ask, and stop there. This is the one case where you should not proceed as best you can: work resting on a guess you could not check costs more to review than the wait for access."
            --allowedTools "Bash(mise run:*)" "Bash(mise tasks:*)" "Bash(mise install)" "Bash(gh pr create:*)" "WebFetch(domain:rescript-lang.org)" "WebFetch(domain:pnpm.io)" "WebFetch(domain:mise.jdx.dev)" "WebFetch(domain:jrr.github.io)"

      # Capture the full JSON session log (all messages, incl. the result
      # message's permission_denials details) as a downloadable artifact
      # instead of dumping it into the public Actions log. The execution file
      # is written regardless of show_full_output; this just retains it.
      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore

  # Reviews submitted by a bot (e.g. the Claude Code Review workflow) can also
  # drive the implementer, but each round requires a human to approve the
  # `bot-review-approval` environment first. This gates the reviewer <->
  # implementer ping-pong: the job waits in "Waiting" until a required reviewer
  # approves it in the run's UI, so it can never run away on its own. Configure
  # the environment and its required reviewers in Settings -> Environments.
  # (Steps are duplicated from `claude` above on purpose — kept inline rather
  # than extracted into a reusable workflow for readability.)
  claude-from-bot-review:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.user.type == 'Bot'
    runs-on: ubuntu-latest
    environment: bot-review-approval
    # The same cap as `claude` above, for the same reason. Safe next to a job
    # that can sit in "Waiting" for days: the clock starts when a reviewer
    # approves and the job begins, not when it is queued behind the approval.
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Don't leave the read-only GITHUB_TOKEN (github-actions[bot],
          # contents: read here) persisted in git config. claude-code-action
          # pushes with the Claude GitHub App token (as claude[bot], whose
          # write access comes from the app installation, not this workflow's
          # permissions block). Since actions/checkout v6 changed how it
          # persists those credentials, a persisted github-actions[bot] token
          # hijacks the push and it 403s. Turning persistence off restores the
          # app-token push. See issue #56.
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Agents operate through the mise task interface (see CLAUDE.md), not
          # raw package-manager/CLI access. Web access is limited to the
          # project's toolchain docs. To grant a new capability, add a mise
          # task or a specific WebFetch domain here rather than widening these.
          claude_args: |
            --model claude-opus-5
            --append-system-prompt "A run has a hard clock, and the solver's soaks can outlast it: mise run solve over the thousand deals is minutes per board, the Spiderette soak is half an hour, and a run cut off mid-soak loses everything it hadn't pushed. So push before you start anything long: commit and push the change itself, then soak. Run the cheap soaks yourself (Mini and Micro are seconds, FreeCell a couple of minutes) and don't start one the remaining run can't finish. When a soak you'd want is too long for the run, end your work by pushing what you have and saying, in the PR or your comment, the exact command to run next (e.g. mise run solve -- --game spiderette4 --quiet 1-200) and which number in docs/solver.md it is measured against, so a human or a later run can pick it up. A blocked host or a denied tool is a stop signal, not an obstacle to work around. Web access here is a short allowlist of toolchain-docs domains and Bash is a short list of mise and gh commands, so a refusal means the interface is too narrow for what you were asked, not that you should improvise. Never route around it, never answer from memory what you went to the docs for, and never quietly drop the part of the task it blocked. Push whatever is already finished, then comment naming the exact host or command that was refused, the URL or invocation, what you needed it for, and what is now unfinished. A blocked domain is a request for a WebFetch(domain:<host>) entry in .github/workflows/; a denied command is a request for a mise task. Ask, and stop there. This is the one case where you should not proceed as best you can: work resting on a guess you could not check costs more to review than the wait for access."
            --allowedTools "Bash(mise run:*)" "Bash(mise tasks:*)" "Bash(mise install)" "Bash(gh pr create:*)" "WebFetch(domain:rescript-lang.org)" "WebFetch(domain:pnpm.io)" "WebFetch(domain:mise.jdx.dev)" "WebFetch(domain:jrr.github.io)"

      # Capture the full JSON session log (all messages, incl. the result
      # message's permission_denials details) as a downloadable artifact
      # instead of dumping it into the public Actions log. The execution file
      # is written regardless of show_full_output; this just retains it.
      - name: Upload Claude execution log
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore

