name: PR Preview

on:
  # `pull_request` (not `pull_request_target`) runs with a read-only token for
  # fork PRs, which is why previews are scoped to same-repo PRs below — forks
  # can't push to `gh-pages`, and using `pull_request_target` to grant them
  # write access would run trusted workflow code against untrusted PR content.
  pull_request:
    types: [opened, reopened, synchronize, closed]

# `contents: write` pushes commits to `gh-pages` to deploy/remove the preview;
# `pull-requests: write` lets the actions post/update the preview-link comments;
# `deployments: write` records the preview in GitHub's deployments API so the
# PR's merge box links to it (see "Start deployment" below).
permissions:
  contents: write
  pull-requests: write
  deployments: write

# Share the `gh-pages` group with the main deploy so all writers of that
# branch are serialized and can't race.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # Skip fork PRs (they lack write access to `gh-pages`). For same-repo PRs
    # the head repo matches the base repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # `pr-preview-action` only pushes to `gh-pages` and comments a link — it
      # never touches the deployments API, which is why the PR reads "This branch
      # has not been deployed" even though the preview is live. Opening a
      # deployment here (and closing it below) is what lights up the merge box's
      # "View deployment" button and the repo's Environments page.
      #
      # Created before the build so the box shows the preview as in progress
      # while it runs; the SHA-keyed `ref` is what ties it to this PR.
      - name: Start deployment
        id: deployment
        if: github.event.action != 'closed'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const { data } = await github.rest.repos.createDeployment({
              owner, repo,
              ref: pr.head.sha,
              // One environment per PR, so a new preview never marks another
              // PR's still-live preview inactive. `transient` tells GitHub to
              // retire it once the branch goes away.
              environment: `pr-preview-${pr.number}`,
              transient_environment: true,
              production_environment: false,
              description: `Preview for PR #${pr.number}`,
              // Without these the API answers with a merge commit or a
              // "waiting on checks" message instead of a deployment: there are
              // no commit statuses to gate on, and the preview is built from
              // the head as-is rather than from a merge with the base.
              required_contexts: [],
              auto_merge: false,
            });
            // A deployment carries no state until its first status, so without
            // this the box sits on "pending" for the whole build instead of
            // showing it as deploying.
            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: data.id,
              state: "in_progress",
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            core.setOutput("id", data.id);

      # The build is only needed for deploy actions, not cleanup. On close the
      # action just removes the preview dir, so skip the build to save time.
      - name: Install mise
        if: github.event.action != 'closed'
        uses: jdx/mise-action@v4

      - name: Bundle the web app
        if: github.event.action != 'closed'
        run: mise run bundle
        # Ship a self-destroying service worker for previews (see vite.config.js).
        # Previews are pruned + rebuilt each push, so a precaching SW would pin a
        # stale shell that 404s and survives reloads; this keeps previews on plain
        # static hosting and cleans up any SW already installed from an earlier build.
        env:
          PIP_PREVIEW: "1"

      # Deploys the built site to `pr-preview/pr-<N>/` on open/sync and removes
      # it on close, commenting the preview URL on the PR. `source-dir` is
      # ignored for the cleanup action.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: packages/web-app/dist

      # `environment_url` is what the merge box's "View deployment" button opens.
      # Built by hand from the action's default `pr-preview/pr-<N>/` umbrella,
      # same as the screenshot comment below builds its own links.
      - name: Finish deployment
        if: github.event.action != 'closed'
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.pull_request.number;
            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "success",
              environment_url: `https://${owner}.github.io/${repo}/pr-preview/pr-${n}/`,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      # Without this a failed build leaves the deployment stuck "in progress"
      # forever, which reads worse than no deployment at all.
      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.id
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

      # The preview dir is gone by now, so retire the deployment to match —
      # otherwise the closed PR keeps advertising a URL that 404s.
      - name: Deactivate deployment
        if: github.event.action == 'closed'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const environment = `pr-preview-${context.payload.pull_request.number}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment, per_page: 100,
            });
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: d.id, state: "inactive",
              });
            }
            // Tidy-up only: one environment per PR would otherwise pile up in
            // Settings -> Environments forever. Deleting one needs repo-admin
            // rights that `GITHUB_TOKEN` may not have, and the deployments are
            // already inactive above, so a refusal here isn't worth failing on.
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner, repo, environment_name: environment,
              });
            } catch (error) {
              core.info(`Left environment ${environment} in place: ${error.message}`);
            }

  # Render the screenshot report and publish it as a *latest-only* per-PR preview:
  # the same pr-preview-action deploys it to its own umbrella `screenshots/pr/pr-<N>/`
  # on open/sync and removes it on close — so cleanup is automatic and there's no
  # hand-rolled git. A separate job (isolated build, own status); `needs: preview`
  # serializes the two gh-pages writers in the run; `continue-on-error` so a render
  # hiccup never fails the preview. Fork PRs are skipped with `preview`.
  screenshots:
    needs: preview
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        if: github.event.action != 'closed'
        uses: jdx/mise-action@v4

      - name: Install headless Chromium
        if: github.event.action != 'closed'
        run: mise run playwright-install

      - name: Render screenshot report
        if: github.event.action != 'closed'
        run: mise run screenshots

      # Deploy on open/sync, remove on close — into a screenshots-only umbrella so
      # it never collides with the app preview above. Its own comment is off; the
      # sticky comment below owns the link (keeping the two previews' comments
      # from fighting over one comment).
      - name: Deploy report preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: packages/web-app/screenshots
          umbrella-dir: screenshots/pr
          comment: false

      - name: Comment report link
        if: github.event.action != 'closed'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.payload.pull_request.number;
            const base = `https://${owner}.github.io/${repo}/screenshots`;
            const prUrl = `${base}/pr/pr-${n}/`;
            // The `main` history listing is newest-first, so its top entry is the
            // latest `main` snapshot — link it for side-by-side comparison. The hub
            // (`${base}/`) browses every branch/PR report.
            const mainUrl = `${base}/branch/main/`;
            const marker = "<!-- screenshot-report -->";
            const body = `${marker}\n📸 **Screenshot report:** ${prUrl}\n🔍 **Compare with \`main\`:** ${mainUrl} _(newest snapshot first)_\n🗂️ **All reports:** ${base}/\n\nMid-game FreeCell across device sizes (portrait + landscape), refreshed each push.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: n, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
            }
