<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Deliberately no `maximum-scale=1` / `user-scalable=no`: pinch-to-zoom is
         kept, both for accessibility and because it's wanted (#113). Double-tap
         zoom is instead disabled app-wide via `touch-action: manipulation` on
         `html, body` (below), which suppresses double-tap-to-zoom while still
         permitting pinch. Flipping pinch off later would be a one-line change
         here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pip</title>

    <!-- PWA. vite-plugin-pwa injects the <link rel="manifest"> at build time.
         The tags below are the bits the manifest can't cover: theme color for
         the browser/OS chrome, and iOS's own install metadata (iOS ignores much
         of the manifest and never fires an install prompt). Icon/href paths are
         relative so they inherit the GitHub Pages project subpath. -->
    <meta name="theme-color" content="#166534" />
    <!-- Prefer the scalable SVG (generated from the real card art); the PNG is
         the fallback for browsers that don't take an SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pip" />

    <!-- Link-preview (Open Graph + Twitter) tags: what Slack/iMessage/Discord/
         Twitter show when the game's URL is pasted (issue #221). The image is a
         crop of the *actually rendered* mid-game board, generated by a headless
         browser at 2× density (`mise run og-image` → public/og-image.png), so the
         unfurled card looks like gameplay rather than a logo. Unlike the icon/href
         paths above, `og:image`/`og:url` must be *absolute* — unfurlers don't
         resolve them against the page — so they hardcode the canonical GitHub
         Pages URL (the deployed site; PR previews live under a subpath and don't
         need a correct unfurl). `summary_large_image` asks for the big 1.91:1
         card; the dimensions match the committed PNG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pip" />
    <meta property="og:title" content="Pip — FreeCell Solitaire" />
    <meta
      property="og:description"
      content="A fast, installable, offline-capable FreeCell solitaire. Play in your browser."
    />
    <meta property="og:url" content="https://jrr.github.io/pip-solitaire/" />
    <meta property="og:image" content="https://jrr.github.io/pip-solitaire/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1306" />
    <meta property="og:image:height" content="686" />
    <meta property="og:image:alt" content="A mid-game Pip FreeCell board, cards fanned across the cascades." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pip — FreeCell Solitaire" />
    <meta
      name="twitter:description"
      content="A fast, installable, offline-capable FreeCell solitaire. Play in your browser."
    />
    <meta name="twitter:image" content="https://jrr.github.io/pip-solitaire/og-image.png" />

    <!-- App styling. One file per component under src/, each imported by the
         component that renders it; what this links is src/styles/index.css, which
         holds the `@layer` order they are all assembled in plus the foundations
         no component owns (#306). Linked rather than inlined so the foundations
         are render-blocking in dev as well as in the built site — a
         component-imported sheet arrives with its module, so in dev it lands a
         beat later, while the build extracts every one of them into the same
         single hashed stylesheet, which vite-plugin-pwa then precaches.

         The key usability fix lives in base.css: padding the page by the
         `env(safe-area-inset-*)` values, since with the translucent iOS status
         bar above, content would otherwise render *under* the clock/notch and
         the home indicator. Colors track the PWA manifest (background #0b1220,
         accent green #166534) so the web page, the OS chrome and the installed
         splash all look like one app. -->
    <script type="module" crossorigin src="./assets/index-DGFAyM4n.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BbnYlgbZ.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <!-- Vite resolves the bare `core/…` specifier the compiled entry imports
         (via the workspace symlink) and bundles the module graph, so no import
         map is needed. The entry also registers the service worker through
         `virtual:pwa-register` and wires the "Update available" flow — with a
         *relative* SW URL, so its scope follows the GitHub Pages subpath. -->
  </body>
</html>
