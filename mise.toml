[tools]
node = "26"
# Installing via npm because the default mechanism is blocked on claude cloud sandboxes.
"npm:pnpm" = "11"

# Tasks are the set of actions available to developers and agents at the repo
# root. Run `mise tasks` to list them.

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.build]
description = "Build all packages"
depends = ["install"]
run = "pnpm run build"

[tasks.test]
description = "Run all test suites"
depends = ["build"]
run = "pnpm run test"

[tasks.start]
description = "Build and run the CLI"
depends = ["build"]
run = "pnpm run start"

# Run the CLI with arguments. Everything after `--` is forwarded to the built
# script, so this exposes the CLI's whole surface through the task interface
# without granting raw `node` access:
#
#   mise run cli -- list            # list the available games
#   mise run cli -- show stacking   # draw a game's opening layout
[tasks.cli]
description = "Run the CLI with args: `mise run cli -- show <game>`"
depends = ["build"]
run = "node packages/cli/dist/cli.js"

# Vite dev/build/preview for the web-app. Each `depends = ["build"]` so ReScript
# compiles the .res.mjs sources first, then Vite operates on them.
#   mise run dev      # Vite dev server with HMR
#   mise run bundle   # production build -> packages/web-app/dist
#   mise run preview  # serve the built dist locally
[tasks.dev]
description = "Run the web-app Vite dev server"
depends = ["build"]
run = "pnpm --filter web-app run dev"

[tasks.bundle]
description = "Build the web-app into a static site (packages/web-app/dist)"
# `icons` regenerates the app icons from the current card art (and itself
# depends on `build`), so a deployed bundle always ships icons that match the
# cards — the "svg renderer in a build step for deployed builds" from #49.
depends = ["icons"]
run = "pnpm --filter web-app run bundle"

[tasks.preview]
description = "Preview the built web-app locally"
depends = ["build"]
run = "pnpm --filter web-app run preview"

# Render device-resolution screenshots of the game into a self-contained report
# (packages/web-app/screenshots/index.html): FreeCell scenes (a freshly dealt board,
# a mid-game layout and the finishable endgame) at a phone and a tablet size, portrait
# and landscape. Depends on `bundle` so it shoots the real built site (served by Vite
# preview), and forces the board into fixed positions via the app's URL contract
# (`?scene=freecell&state=…`, or a pinned `seed` with `animate=off` for the dealt
# board) so the shots are deterministic. CI publishes the result as an artifact
# (see the screenshots workflow). The headless Chromium is Playwright's;
# `playwright-install` fetches it on a clean runner (this repo's dev containers ship
# one already).
[tasks.screenshots]
description = "Render device-resolution screenshots of the game into a report"
depends = ["bundle"]
run = "node packages/web-app/scripts/screenshots.mjs"

# The browser-driven checks (issue #243): a `@playwright/test` suite in
# packages/web-app/browser-tests, covering the things jsdom can't answer —
#   win.spec          the win overlay end-to-end, played by a real pointer drag (#121)
#   geometry.spec     the card/zone/slot footprint invariants, at three viewports
#   rail.spec         the landscape rail clearing the scene band, in four chrome regimes (#204)
#   finish-tilt.spec  the finish sweep's re-tilt riding each card's flight (#241)
# — because each needs real layout, `calc()`, media queries, resolved transform
# matrices or live transitions.
#
# Kept out of `mise run ci` on purpose: `ci` stays browser-free, and this suite
# needs `bundle` (a built dist/, served by Vite preview — see the config's
# `webServer`) where the ReScript unit tests only need `build`. CI runs it as its
# own job, after `playwright-install`.
[tasks.verify]
description = "Run the browser test suite against the built web app"
depends = ["bundle"]
run = "pnpm --filter web-app exec playwright test"

# Passthrough to the Playwright CLI in the web-app, in the same spirit as the
# `rescript` task: everything after `--` is forwarded, so the whole CLI surface is
# reachable without widening the `Bash(mise run:*)` allowlist —
#
#   mise run playwright -- test --headed -g rail   # one spec, in a visible browser
#   mise run playwright -- test --ui               # the interactive runner
#   mise run playwright -- show-report             # the last run's HTML report
#
# Unlike `verify` this doesn't bundle first (a passthrough shouldn't assume the
# subcommand wants one); run `mise run bundle` — or `mise run verify` once — if
# dist/ is stale.
[tasks.playwright]
description = "Run the Playwright CLI: `mise run playwright -- test --headed -g rail`"
run = "pnpm --filter web-app exec playwright"

# Install the headless Chromium that `verify` and `screenshots` drive. Split out
# from the tasks themselves so a machine that already has a browser (this repo's
# dev containers) skips the download; CI runs this once before each. `--with-deps`
# also pulls the system libraries Chromium needs on a bare Linux runner.
[tasks.playwright-install]
description = "Install the headless Chromium Playwright uses for the browser tasks"
depends = ["install"]
run = "pnpm --filter web-app exec playwright install --with-deps chromium"

# Regenerate the self-hosted fonts in packages/web-app (issue #114). Rebuilds
# the vendored woff2/ttf from their upstream @fontsource sources — Libre Franklin
# (chrome + card ranks) and a merged four-glyph "Pip Suits" subset of IBM
# Plex Sans JP (card pips) — so the faces are reproducible, not opaque binaries.
# Analogous to `icons`; the outputs are committed, so this only needs re-running
# when the source faces or the subset change.
[tasks.fonts]
description = "Regenerate the web-app self-hosted fonts from their sources"
depends = ["install"]
run = "node packages/web-app/scripts/generate-fonts.mjs"

# Regenerate the PWA icons in packages/web-app/public. The icon is composed from
# the real CardArt cards (a fanned 7·8·9), so it depends on `build` to compile
# the ReScript art first, then rasterizes it with @resvg/resvg-js. Pass
# `-- --svg` to print the master SVG instead of writing files.
[tasks.icons]
description = "Generate the web-app PWA icons from the card art"
depends = ["build"]
run = "node packages/web-app/scripts/generate-icons.mjs"

# Regenerate the link-preview (Open Graph) image in packages/web-app/public
# (issue #221). Unlike `icons`, which composes an SVG from the card art, the
# preview is meant to look like gameplay, so it's a crop of the *actually rendered*
# mid-game FreeCell board — driven through the same headless Chromium the
# `screenshots` task uses, at a 2× (high-DPI) device scale for a crisp unfurl.
# `depends = ["bundle"]` so it shoots the real built site; the output (og-image.png)
# is committed like the icons and picked up by `bundle`'s public/ copy. The browser
# is Playwright's; `playwright-install` fetches it on a clean runner.
[tasks.og-image]
description = "Generate the link-preview image from a rendered mid-game board"
depends = ["bundle"]
run = "node packages/web-app/scripts/generate-og-image.mjs"

# Refresh the lockfile after changing dependencies (CI installs with a frozen
# lockfile, so it must be committed in sync with the package.json files).
[tasks.relock]
description = "Refresh the pnpm lockfile after dependency changes"
run = "pnpm install --lockfile-only"

# Format every ReScript source file in the workspace, in place. ReScript ships
# its own formatter, so this just fans the `rescript format` CLI across all
# packages. Run it before committing; editors can also format-on-save (see
# .vscode/ and CLAUDE.md).
[tasks.format]
description = "Format all ReScript source files in place"
depends = ["install"]
run = "pnpm -r exec rescript format"

# Verify formatting without changing anything — fails if any file would be
# reformatted. This is what CI enforces (wired into `ci` below).
[tasks.format-check]
description = "Check that all ReScript source is formatted (fails if not)"
depends = ["install"]
run = "pnpm -r exec rescript format --check"

# Passthrough to the ReScript CLI in a single package. Everything after `--`
# is forwarded to `rescript`, so this one task exposes the whole compiler
# surface (build, build -w, format, clean, …) without granting raw CLI access:
#
#   mise run rescript -- core build -w      # rescript build -w, in packages/core
#   mise run rescript -- core format -all
#
# It stays inside the `Bash(mise run:*)` allowlist, so no workflow change is
# needed to reach a new rescript subcommand.
[tasks.rescript]
description = "Run the ReScript CLI in one package: `mise run rescript -- <package> <args>`"
run = "pnpm --filter \"{{arg(name='package')}}\" exec rescript"

# `depends` runs in parallel, so listing install/build/test here would race
# (test importing build output before build finished). Chain them instead:
# test → build → install, so `ci` just needs `test` and the order is enforced.
# `format-check` only reads source (no build output), so it can run alongside
# test — its own `depends = ["install"]` dedupes with test's install.
[tasks.ci]
description = "Install, build, test, and format-check — what the CI pipeline runs"
depends = ["test", "format-check"]
