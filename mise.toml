[tools]
node = "26"
# Installing via npm because the default mechanism is blocked on claude cloud sandboxes.
"npm:pnpm" = "11"

# Tasks are the set of actions available to developers and agents at the repo
# root: `mise tasks` lists them, `mise run <task>` runs one. The "why" for a
# script-backed task lives in the script's header comment; packages/web-app/
# scripts/README.md maps script → task → output.

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.build]
description = "Build all packages"
depends = ["install"]
run = "pnpm run build"

[tasks.test]
description = "Run all test suites"
depends = ["build"]
run = "pnpm run test"

[tasks.start]
description = "Build and run the CLI"
depends = ["build"]
run = "pnpm run start"

# Passthrough: everything after `--` reaches the CLI, so its whole surface is
# available without granting raw `node` access.
[tasks.cli]
description = "Run the CLI with args: `mise run cli -- show <game>`"
depends = ["build"]
run = "node packages/cli/dist/cli.js"

[tasks.dev]
description = "Run the web-app Vite dev server"
depends = ["build"]
run = "pnpm --filter web-app run dev"

# `depends = ["icons"]` so a deployed bundle always ships icons matching the
# current card art (#49).
[tasks.bundle]
description = "Build the web-app into a static site (packages/web-app/dist)"
depends = ["icons"]
run = "pnpm --filter web-app run bundle"

[tasks.preview]
description = "Preview the built web-app locally"
depends = ["build"]
run = "pnpm --filter web-app run preview"

# Shoots the built site on emulated devices (Playwright's `devices` registry) and
# writes packages/web-app/screenshots/index.html. CI publishes it as an artifact.
[tasks.screenshots]
description = "Render device-resolution screenshots of the game into a report"
depends = ["bundle"]
run = "node packages/web-app/scripts/screenshots/render.mjs"

# Stage the rendered report for publication to gh-pages (called by deploy-pages.yml):
#   mise run stage-screenshots -- <stagingDir> <stamp> [--existing <json>] [--title <t>]
[tasks.stage-screenshots]
description = "Stage the rendered report + history listing for Pages publication"
run = "node packages/web-app/scripts/screenshots/stage.mjs"

# Write the `/screenshots/` hub page that lists the per-branch and per-PR reports:
#   mise run screenshots-hub -- <outDir>
[tasks.screenshots-hub]
description = "Generate the screenshots hub page (`mise run screenshots-hub -- <outDir>`)"
run = "node packages/web-app/scripts/screenshots/hub.mjs"

# The solver (`core/src/Solver.res`) with nothing attached — no browser, no
# bundle, no drags: it thinks a deal through and prints the moves. Takes deal
# numbers and ranges like `autoplay` does: `-- 24680`, `-- 1-100 --quiet`. This is
# what you measure a heuristic change with; `autoplay` is the same brain playing
# the real app.
[tasks.solve]
description = "Solve a deal without playing it: `mise run solve -- 24680`"
depends = ["build"]
run = "node packages/core/scripts/solve.mjs"

# Plays the built site to a win in a real browser, every move a pointer drag —
# no reaching into game state (packages/web-app/scripts/autoplay). Takes deal
# numbers and ranges: `-- 24680`, `-- 1-25`, plus `--headed` to watch it play.
[tasks.autoplay]
description = "Play FreeCell in a browser, end to end: `mise run autoplay -- 24680`"
depends = ["bundle"]
run = "node packages/web-app/scripts/autoplay/play.mjs"

# The browser-driven checks (packages/web-app/browser-tests): the things jsdom
# can't answer — real layout, `calc()`, media queries, transform matrices, live
# transitions, pointer input. Kept out of `ci` on purpose (`ci` stays
# browser-free); CI runs it as its own job after `playwright-install`.
# Boots the dev server and loads the app in a browser. Small on purpose: it covers
# the one path the test suites can't, since `vite dev` lowers the compiler's JSX by
# a different route than `vite build` does (see scripts/dev-smoke.mjs).
[tasks.dev-smoke]
description = "Boot the dev server and check the app renders"
depends = ["build"]
run = "node packages/web-app/scripts/dev-smoke.mjs"

[tasks.browsertest]
description = "Run the browser test suite against the built web app"
depends = ["bundle"]
run = "pnpm --filter web-app exec playwright test"

# Passthrough to the Playwright CLI — `mise run playwright -- test --headed -g rail`,
# `-- test --ui`, `-- show-report`. Doesn't bundle first; run `browsertest` once if
# dist/ is stale.
[tasks.playwright]
description = "Run the Playwright CLI: `mise run playwright -- test --headed -g rail`"
run = "pnpm --filter web-app exec playwright"

# Split out from the browser tasks so a machine that already has a Chromium skips
# the download. `--with-deps` also apt-installs Chromium's shared libraries, which
# is what a bare Linux box needs and a macOS box ignores.
[tasks.playwright-install]
description = "Install the headless Chromium Playwright uses for the browser tasks"
depends = ["install"]
run = "pnpm --filter web-app exec playwright install --with-deps chromium"

# The same download *without* the apt half — what CI runs. The GitHub runner image
# already ships Chromium's shared libraries (it installs Google Chrome from its own
# apt source), so `--with-deps` there installs nothing new; all it buys is a round
# trip to Ubuntu's mirrors on every single run. And those mirrors stall: apt spends
# ~30s giving up on `azure.archive.ubuntu.com` (`Ign`), falls back to
# `archive.ubuntu.com`, starts fetching InRelease — and then hangs there with no
# output and no timeout of its own, which is what wedged the screenshot job for 55
# minutes on 2026-08-18. Skipping the apt step removes that failure mode outright;
# if the image ever does drop a library, Chromium fails to launch loudly and fast
# instead of hanging, and this task goes back to `playwright-install`.
[tasks.playwright-install-browser]
description = "Install headless Chromium only, skipping the apt system-library step"
depends = ["install"]
run = "pnpm --filter web-app exec playwright install chromium"

# Outputs are committed, so this only needs re-running when the source faces or
# the subset change (#114).
[tasks.fonts]
description = "Regenerate the web-app self-hosted fonts from their sources"
depends = ["install"]
run = "node packages/web-app/scripts/generate/fonts.mjs"

# Composed from the real CardArt cards, hence `depends = ["build"]`. Pass
# `-- --svg` to print the master SVG instead of writing files.
[tasks.icons]
description = "Generate the web-app PWA icons from the card art"
depends = ["build"]
run = "node packages/web-app/scripts/generate/icons.mjs"

# A crop of the actually-rendered mid-game board, so it needs the built site
# (#221). Output is committed like the icons.
[tasks.og-image]
description = "Generate the link-preview image from a rendered mid-game board"
depends = ["bundle"]
run = "node packages/web-app/scripts/generate/og-image.mjs"

# CI installs with a frozen lockfile, so the lockfile must be committed in sync
# with the package.json files.
[tasks.relock]
description = "Refresh the pnpm lockfile after dependency changes"
run = "pnpm install --lockfile-only"

# ReScript ships its own formatter; this fans it across all packages. Run it
# before committing (editors can also format-on-save — see .vscode/).
[tasks.format]
description = "Format all ReScript source files in place"
depends = ["install"]
run = "pnpm -r exec rescript format"

[tasks.format-check]
description = "Check that all ReScript source is formatted (fails if not)"
depends = ["install"]
run = "pnpm -r exec rescript format --check"

# Every deprecation the compiler warns about names the rewrite that resolves it,
# and ships it as an automatic migration; this fans those across all packages the
# way `format` fans the formatter, so `mise run build` can be kept warning-free
# without hand-editing each call site. It rewrites source in place and doesn't
# format afterwards — run `format` next, and read the diff before committing.
#
# `depends = ["build"]` because the tool reads the compiler's analysis artifacts,
# not the source: against a stale (or absent) lib/ it reports "migrated 0" and
# silently changes nothing.
[tasks.migrate]
description = "Apply ReScript's automatic deprecation migrations to all source in place"
depends = ["build"]
run = "pnpm -r exec rescript-tools migrate-all ."

# Passthrough to the ReScript CLI in one package, so the whole compiler surface
# (build, build -w, format, clean, …) is reachable through the task interface:
#   mise run rescript -- core build -w
[tasks.rescript]
description = "Run the ReScript CLI in one package: `mise run rescript -- <package> <args>`"
run = "pnpm --filter \"{{arg(name='package')}}\" exec rescript"

# The same passthrough for ReScript's *tools* CLI, which ships separately from the
# compiler: migrate/migrate-all (see `migrate` above), doc, reanalyze, …
#   mise run rescript-tools -- core migrate src/CardText.res --stdout
[tasks.rescript-tools]
description = "Run the ReScript Tools CLI in one package: `mise run rescript-tools -- <package> <args>`"
run = "pnpm --filter \"{{arg(name='package')}}\" exec rescript-tools"

# `depends` runs in parallel, so install/build/test are chained through each
# other's `depends` rather than listed here (test → build → install), which is
# why this only names `test`. `format-check` only reads source, so it can run
# alongside.
[tasks.ci]
description = "Install, build, test, and format-check — what the CI pipeline runs"
depends = ["test", "format-check"]
